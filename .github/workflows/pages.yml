name: GitHub Pages

# Publishes site/ to GitHub Pages.
# Repository Settings → Pages → Source を「GitHub Actions」にしておくこと。
on:
  push:
    branches: [main]
    paths: ["site/**", "tools/site_fill_release.py", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'release' && 'release' || 'deploy' }}
  cancel-in-progress: true

jobs:
  # A release run starts on the tag, and the github-pages environment only
  # accepts deployments from main. So a published release just re-runs this
  # workflow on main (workflow_dispatch is allowed with GITHUB_TOKEN), which
  # then picks up the new version.
  redeploy-on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"

  # Upload and deploy run as separate jobs (as in GitHub's own Pages template).
  # In one job, deploy-pages often could not find the artifact just uploaded
  # ("No artifacts named github-pages") and only a re-run would succeed.
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Show the latest release (version and date) on the pages. If there is
      # none or the API fails, the pages keep their fallback text.
      - name: Write the latest release into the pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if release=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name + " " + .published_at'); then
            python3 tools/site_fill_release.py $release
          else
            echo "::warning::Could not read the latest release; keeping the fallback text."
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
